version: "3.9"

services:
  advanced-rag-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: advanced-rag-api:latest
    ports:
      - "8006:8006"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - ANSWER_BACKEND=rule_based
    volumes:
      - ../data:/app/data
    restart: unless-stopped
